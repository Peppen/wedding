<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <style>
      .mono {
        font-family: 'Playfair Display', 'Times New Roman', Georgia, serif;
        font-weight: 700;
      }
      .amp {
        font-family: 'Playfair Display', 'Times New Roman', Georgia, serif;
        font-weight: 400;
        font-style: italic;
      }
    </style>
  </defs>

  <!-- strato ombra (effetto inciso, coerente con text-shadow del CSS originale) -->
  <g fill="#462d05" opacity="0.55">
    <text x="52" y="128" text-anchor="middle" class="mono" font-size="78">M</text>
    <text x="100" y="112" text-anchor="middle" class="amp" font-size="34">&amp;</text>
    <text x="150" y="128" text-anchor="middle" class="mono" font-size="78">K</text>
  </g>

  <!-- strato luce (colore principale, stesso oro delle iniziali nel CSS) -->
  <g fill="#f8e7ad">
    <text x="50" y="125" text-anchor="middle" class="mono" font-size="78">M</text>
    <text x="99" y="109" text-anchor="middle" class="amp" font-size="34">&amp;</text>
    <text x="148" y="125" text-anchor="middle" class="mono" font-size="78">K</text>
  </g>
</svg>
